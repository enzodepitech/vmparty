services:
  manager-api:
    build: .
    container_name: vm-manager-api
    extra_hosts:
      - "guacamole.lilepiserver.duckdns.org:192.168.10.101"
    env_file:
      - /etc/environment
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./ansible:/app/ansible
    restart: unless-stopped
