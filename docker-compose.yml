services:
  manager-api:
    build: .
    container_name: vm-manager-api
    extra_hosts:
      - "guacamole.lilepiserver.duckdns.org:192.168.10.101"
    env_file:
      - /etc/environment
    environment:
      - SECRET_KEY
      - ADMIN_USERNAME
      - ADMIN_PASSWORD_HASH
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
