<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Édition</title>
    <style>
     body {
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background-color: #f4f6f9;
         padding: 2rem;
     }

     dialog.modal-dialog {
         border: none;
         border-radius: 12px;
         padding: 0;
         box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
         max-width: 500px;
         width: 90%;
         background: #ffffff;
     }

     dialog.modal-dialog::backdrop {
         background: rgba(15, 23, 42, 0.5);
         backdrop-filter: blur(4px);
     }

     .modal-header {
         padding: 1.25rem 1.5rem;
         border-bottom: 1px solid #e2e8f0;
     }

     .modal-header h2 {
         margin: 0;
         font-size: 1.25rem;
         color: #1e293b;
     }

     .modal-body {
         padding: 1.5rem;
     }

     .form-group {
         margin-bottom: 1.25rem;
     }

     .form-group label {
         display: block;
         margin-bottom: 0.5rem;
         font-weight: 500;
         font-size: 0.875rem;
         color: #475569;
     }

     .form-control {
         width: 100%;
         padding: 0.625rem 0.75rem;
         border: 1px solid #cbd5e1;
         border-radius: 6px;
         font-size: 0.95rem;
         box-sizing: border-box;
         transition: border-color 0.15s ease-in-out;
     }

     .form-control:focus {
         outline: none;
         border-color: #3b82f6;
         box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
     }

     .modal-footer {
         padding: 1rem 1.5rem;
         background-color: #f8fafc;
         border-top: 1px solid #e2e8f0;
         display: flex;
         justify-content: flex-end;
         gap: 0.75rem;
         border-bottom-left-radius: 12px;
         border-bottom-right-radius: 12px;
     }

     /* Boutons */
     .btn {
         padding: 0.625rem 1.25rem;
         border-radius: 6px;
         font-weight: 500;
         font-size: 0.875rem;
         cursor: pointer;
         border: 1px solid transparent;
         transition: all 0.15s ease-in-out;
     }

     .btn-secondary {
         background-color: #ffffff;
         border-color: #cbd5e1;
         color: #475569;
     }

     .btn-secondary:hover {
         background-color: #f1f5f9;
         color: #1e293b;
     }

     .btn-primary {
         background-color: #2563eb;
         color: #ffffff;
     }

     .btn-primary:hover:not(:disabled) {
         background-color: #1d4ed8;
     }

     /* État désactivé du bouton Valider */
     .btn-primary:disabled {
         background-color: #94a3b8;
         cursor: not-allowed;
         opacity: 0.7;
     }
    </style>
  </head>
  <body>
    <dialog id="editModal" class="modal-dialog">
      <div class="modal-header">
        <h2>Modifier les informations</h2>
      </div>

      <form id="editForm" onSubmit="return startEdit(event, {{ config.id }})">
        <div class="modal-body">
          
          <input type="hidden" name="id" value="{{ config.id }}">
          <input type="hidden" name="vm_id" value="{{ config.vm_id }}">
          <input type="hidden" name="vm_ip" value="{{ config.vm_ip }}">

          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" class="form-control" value="{{ config.team_name }}" required>
          </div>

          <div class="form-group">
            <label>Emails</label>
            <div id="student-emails-list">
              {% for student_mail in students %}
                <div class="flex items-center justify-between gap-2 mb-2">
                  <input type="email"
                         name="student_email_input"
                         class="form-control student-email-item"
                         value="{{ student_mail }}" required>
                  <button type="button"
                          onclick="removeStudentInput(this)"
                          class="h-10 w-10 rounded-full bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-700">
                    <i class="fa fa-trash white" aria-hidden="true"></i>
                  </button>
                </div>
              {% else %}
                <p>No emails configured.</p>
              {% endfor %}
            </div>
          </div>

          <button type="button"
                  aria-label="Add new student mail"
                  onclick="addStudentInput()"
                  title="Add new configuration"
                  class="flex-shrink-0 inline-flex items-center justify-center w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white shadow-md transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>

        <div class="modal-footer">
          <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="submitBtn" class="btn btn-primary" disabled>Validate</button>
        </div>
      </form>
    </dialog>

    <script src="{{ url_for('static', path='js/edit.js') }}"></script>
    <script src="{{ url_for('static', path='js/ansibleConsole.js') }}"></script>
  </body>
</html>
