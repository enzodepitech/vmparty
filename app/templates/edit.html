<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='css/edit.css') }}">
    <title>Edition</title>
  </head>
  <body>
    <dialog id="editModal" class="modal-dialog">
      <div class="modal-header">
        <h2>Modify information</h2>
      </div>

      <form id="editForm" onSubmit="return startEdit(event, {{ config.id }})">
        <div class="modal-body">
          <div class="form-group">
            <label>Emails</label>
            <div id="student-emails-list">
              {% for student in students %}
                <div class="flex items-center justify-between gap-2 mb-2">
                  <input type="email"
                         name="student_email_input"
                         class="form-control student-email-item"
                         value="{{ student.mail }}" required>
                  <button type="button"
                          onclick="removeStudentInput(this)"
                          class="h-10 w-10 rounded-full bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-700">
                    <i class="fa fa-trash white" aria-hidden="true"></i>
                  </button>
                </div>
              {% else %}
                <p>No emails configured.</p>
              {% endfor %}
            </div>
          </div>

          <button type="button"
                  aria-label="Add new student mail"
                  onclick="addStudentInput()"
                  title="Add new configuration"
                  class="flex-shrink-0 inline-flex items-center justify-center w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white shadow-md transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>

        <div class="modal-footer">
          <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="submitBtn" class="btn btn-primary" disabled>Validate</button>
        </div>
      </form>
    </dialog>

    <script src="{{ url_for('static', path='js/edit.js') }}"></script>
    <script src="{{ url_for('static', path='js/ansibleConsole.js') }}"></script>
  </body>
</html>
