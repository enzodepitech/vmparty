<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM & Guacamole Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-6xl mx-auto">
      <h1 class="text-3xl font-bold text-gray-800 mb-6">Group VM & Guacamole Configuration</h1>
      
      <!-- Add Configuration Card -->
      <div class="bg-white p-6 rounded-lg shadow-md mb-8">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">Add New Team Configuration</h2>
        <form action="/add" method="POST" class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <input type="text" name="team_name" placeholder="Team Name (e.g. Team A)" required class="border p-2 rounded w-full">
          <input type="number" name="vm_id" placeholder="VM ID (e.g. 101)" required class="border p-2 rounded w-full">
          <input type="text" name="vm_ip" placeholder="VM IP (e.g. 192.168.1.101)" required class="border p-2 rounded w-full">
          <input type="text" name="student_emails" placeholder="Emails (comma separated)" required class="border p-2 rounded w-full">
          <button type="submit" class="md:col-span-4 bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700 transition">Add Configuration</button>
        </form>
      </div>

      <!-- Configurations Table -->
      <div class="bg-white rounded-lg shadow-md overflow-hidden mb-8">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-800 text-white">
              <th class="p-4">Team</th>
              <th class="p-4">VM ID</th>
              <th class="p-4">VM IP</th>
              <th class="p-4">Student Members</th>
              <th class="p-4 text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            {% for config in configs %}
              <tr class="border-b hover:bg-gray-50">
                <form action="/edit/{{ config.id }}" method="POST">
                  <td class="p-4"><input type="text" name="team_name" value="{{ config.team_name }}" class="border p-1 rounded w-full"></td>
                  <td class="p-4"><input type="number" name="vm_id" value="{{ config.vm_id }}" class="border p-1 rounded w-20"></td>
                  <td class="p-4"><input type="text" name="vm_ip" value="{{ config.vm_ip }}" class="border p-1 rounded w-36"></td>
                  <td class="p-4"><input type="text" name="student_emails" value="{{ config.student_emails }}" class="border p-1 rounded w-full"></td>
                  <td class="p-4 flex justify-center gap-2">
                    <button type="submit" class="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700">Save</button>
                </form>
                <form action="/delete/{{ config.id }}" method="POST" onsubmit="return confirm('Delete this configuration?');">
                  <button type="submit" class="bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-700">Delete</button>
                </form>
                  </td>
              </tr>
            {% else %}
              <tr>
                <td colspan="5" class="p-4 text-center text-gray-500">No configurations found. Add one above!</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>

      <div class="mb-8">
        <!-- Bouton Export Global -->
        <form action="/export" method="POST" class="">
          <button type="submit" class="p-4 md:col-span-4 bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700 transition">
            📁 Export Global Configuration
          </button>
        </form>
      </div>
    </div>

    <!-- Ansible Execution & Live Log Container -->
<div class="max-w-4xl mx-auto my-6 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl overflow-hidden font-mono text-sm">
  
  <!-- Header Bar -->
  <div class="flex items-center justify-between px-4 py-3 bg-slate-950 border-b border-slate-800 text-slate-400">
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
      <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
      <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
      <span class="ml-2 font-semibold text-slate-300">Ansible Deployment Console</span>
    </div>
    <div class="flex items-center space-x-2 text-xs">
      <span id="status-badge" class="px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-medium">Idle</span>
    </div>
  </div>

  <!-- Terminal Output Area -->
  <div id="terminal-logs" class="h-96 p-4 overflow-y-auto bg-slate-950/50 text-slate-200 font-mono text-xs leading-relaxed whitespace-pre-wrap select-text">
    <span class="text-slate-500">// Logs will stream here live when deployment is triggered...</span>
  </div>

  <!-- Footer Actions -->
  <div class="flex items-center justify-between px-4 py-3 bg-slate-900 border-t border-slate-800">
    <button 
      id="deploy-btn"
      onclick="startDeployment()"
      class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs rounded-lg shadow-sm transition-all flex items-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
    >
      <span>Deploy Student VMs</span>
    </button>
    <button 
      onclick="clearLogs()" 
      class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs rounded-md transition-colors cursor-pointer"
    >
      Clear Console
    </button>
  </div>
</div>

<!-- WebSocket Controller Script -->
<script>
    let socket = null;

    function startDeployment() {
        const terminal = document.getElementById("terminal-logs");
        const deployBtn = document.getElementById("deploy-btn");
        const statusBadge = document.getElementById("status-badge");

        // Clear previous logs
        terminal.innerHTML = "";

        // Update UI state
        deployBtn.disabled = true;
        statusBadge.textContent = "Deploying...";
        statusBadge.className = "px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium";

        // Establish WebSocket Connection
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}/ws/deploy`;

        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            appendLogLine("[System] Connection established to deployment engine...", "text-indigo-400");
        };

        socket.onmessage = (event) => {
            const line = event.data;

            // Basic ANSI/Ansible text color highlight parsing
            let colorClass = "text-slate-300";
            if (line.includes("PLAY [") || line.includes("TASK [")) colorClass = "text-cyan-400 font-bold";
            else if (line.includes("ok:")) colorClass = "text-emerald-400";
            else if (line.includes("changed:")) colorClass = "text-amber-300";
            else if (line.includes("FAILED!") || line.includes("fatal:")) colorClass = "text-rose-400 font-semibold";
            else if (line.includes("--- Starting") || line.includes("--- Deployment")) colorClass = "text-indigo-400 font-semibold";

            appendLogLine(line, colorClass);
        };

        socket.onerror = (error) => {
            appendLogLine("[Error] WebSocket error occurred.", "text-rose-400 font-semibold");
        };

        socket.onclose = () => {
            deployBtn.disabled = false;
            statusBadge.textContent = "Finished";
            statusBadge.className = "px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium";
            appendLogLine("[System] Connection closed.", "text-slate-500");
        };
    }

    function appendLogLine(text, colorClass = "text-slate-300") {
        const terminal = document.getElementById("terminal-logs");
        const lineElement = document.createElement("div");
        lineElement.className = colorClass;
        lineElement.textContent = text;
        terminal.appendChild(lineElement);

        // Auto-scroll to bottom
        terminal.scrollTop = terminal.scrollHeight;
    }

    function clearLogs() {
        const terminal = document.getElementById("terminal-logs");
        terminal.innerHTML = '<span class="text-slate-500">// Logs cleared. Ready to deploy...</span>';
    }
</script>
  </body>
</html>
