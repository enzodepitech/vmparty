---
- name: Deploy VMs to Proxmox
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../storage/exports/vars.yml

  tasks:
    - name: Create VMs and LXCs
      community.proxmox.proxmox:
        api_host: "{{ lookup('env', 'PROXMOX_API_URL') }}"
        api_user: "{{ lookup('env', 'PROXMOX_API_TOKEN_ID') }}"
        api_token_id: "{{ lookup('env', 'PROXMOX_API_TOKEN_ID') }}"
        api_token_secret: "{{ lookup('env', 'PROXMOX_API_TOKEN_SECRET') }}"
        vmid: "{{ item.vmid }}"
        hostname: "{{ item.name }}"
        node: "pve"
        ostemplate: "local:vztmpl/debian-12-standard_12.2-1_amd64.tar.zst"
        netif: '{"net0":"name=eth0,bridge=vmbr0,ip={{ item.ip }},gw=192.168.1.1"}'
        state: present
        start_it: true
      loop: "{{ vms }}"