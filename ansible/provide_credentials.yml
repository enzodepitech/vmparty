---
- name: Provision Student Accounts in LXC Containers
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../storage/exports/credentials.yml

  tasks:
    - name: Ensure student user exists with home directory
      ansible.builtin.command: >
        pct exec {{ item.vmid }} -- useradd --badname -m -s /bin/bash {{ item.username }}
      loop: "{{ student_credentials }}"
      register: user_res
      # rc 0 = created user, rc 9 = user already exists (idempotent)
      failed_when: user_res.rc != 0 and user_res.rc != 9
      changed_when: user_res.rc == 0

    - name: Enforce strict 700 permissions on home directory
      ansible.builtin.command: >
        pct exec {{ item.vmid }} -- chmod 700 /home/{{ item.username }}
      loop: "{{ student_credentials }}"
      changed_when: false

    - name: Set student user password
      ansible.builtin.command: >
        pct exec {{ item.vmid }} -- bash -c "echo '{{ item.username }}:{{ item.password }}' | chpasswd"
      loop: "{{ student_credentials }}"
      changed_when: false