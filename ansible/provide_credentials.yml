---
- name: Configure Student Users inside Containers
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../storage/exports/credentials.yml

  tasks:
    - name: Ensure student user account exists with home directory
      ansible.builtin.user:
        name: "{{ item.username }}"
        password: "{{ item.password | password_hash('sha512') }}"
        shell: /bin/bash
        create_home: true
        allow_nonstandard_name: true
        state: present
      loop: "{{ student_credentials }}"

    - name: Enforce strict 700 permissions on home directory
      ansible.builtin.file:
        path: "/home/{{ item.username }}"
        state: directory
        owner: "{{ item.username }}"
        group: "{{ item.username }}"
        mode: '0700'
      loop: "{{ student_credentials }}"